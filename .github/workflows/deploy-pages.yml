name: Deploy to GitHub Pages

# Deploy on every push to main.
# Uses an artefact + GitHub Pages deployment so the site is rebuilt
# on content changes without needing a separate trigger from the registry repo.
on:
  push:
    branches: [main]

# Minimal scope: read repo, write to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
